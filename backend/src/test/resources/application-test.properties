# Isolated in-memory database for tests (MySQL compatibility mode). Flyway is bypassed; Hibernate builds the tables.
spring.datasource.url=jdbc:h2:mem:warehouse_test;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=15000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=30
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
inventory.seed.enabled=false
inventory.low-stock-threshold=5
inventory.max-stock-quantity=1000000
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
