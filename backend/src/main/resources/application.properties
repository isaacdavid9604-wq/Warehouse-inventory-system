spring.application.name=warehouse-inventory-backend
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# ---- Database (credentials come from environment variables) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/warehouse_inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:warehouse_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# ---- Schema: Flyway owns the schema, Hibernate never changes it ----
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# ---- JSON ----
spring.jackson.default-property-inclusion=non_null

# ---- Business configuration ----
inventory.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}
inventory.max-stock-quantity=${MAX_STOCK_QUANTITY:1000000}
inventory.seed.enabled=${SEED_ENABLED:true}
inventory.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# ---- Actuator / OpenAPI ----
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
